# Checks the EDGEmods registry App is set up: the App ID variable, the private key secret,
# and an installation that covers this repository. Run it by hand from the Actions tab.
# It only reads; it never touches a pull request or the registry.

name: App check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: The App ID variable
        env:
          APP_ID: ${{ vars.EDGEMODS_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::The Actions variable EDGEMODS_APP_ID is not set (a secret of that name does not count)."
            exit 1
          fi
          echo "App ID: $APP_ID"

      - name: Get the EDGEmods App's token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.EDGEMODS_APP_ID }}
          private-key: ${{ secrets.EDGEMODS_APP_PRIVATE_KEY }}

      - name: What the App can reach
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          repos=$(gh api installation/repositories --jq '.repositories[].full_name')
          echo "The App is installed on:"
          echo "$repos"
          if ! echo "$repos" | grep -qx "$GITHUB_REPOSITORY"; then
            echo "::error::The App is not installed on $GITHUB_REPOSITORY."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/installation" --jq '"Permissions: " + (.permissions | to_entries | map(.key + " " + .value) | join(", "))'
          echo "The App is ready to merge registry pull requests."
