# Builds and tests the packages on every push and pull request to main.
# Runs no code from pull requests with any privileges: read-only token, no secrets.

name: Test

on:
  push:
    branches: [main]
    # A merged publish pull request changes only registry/; nothing here to test.
    paths-ignore:
      - 'registry/**'
  pull_request:
    branches: [main]
    # Publish pull requests only add a registry file; registry.yml checks those.
    paths-ignore:
      - 'registry/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:example
