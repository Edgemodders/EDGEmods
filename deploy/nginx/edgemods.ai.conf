# EDGEmods' nginx site. deploy/add-domain.sh writes it to /etc/nginx/conf.d/<name>.conf with __NAME__ and __PORT__
# filled in; certbot (--nginx) then adds the HTTPS half and the redirect from HTTP. Edit it here and re-run the
# script for a new site; once certbot has edited the live copy, change that copy by hand, with nginx -t.
# Written by deploy/add-domain.sh (EDGEmods).

# www.__NAME__ goes to __NAME__. A location, not a server-level return, so certbot's challenge location still wins.
server {
    listen 80;
    server_name www.__NAME__;
    location / {
        return 301 https://__NAME__$request_uri;
    }
}

server {
    listen 80;
    server_name __NAME__;

    # nginx's default. Larger only where the design says so (docs/design.md, "Hosting", nginx).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The service trusts these from the loopback only (app.set('trust proxy', 'loopback')).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The index handover from the index rebuild: a whole index.db, streamed to the service as it arrives.
    location = /api/v1/admin/index {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Free downloads at the free speed (X-Accel-Redirect from the service).
    include /etc/nginx/edgemods/edgemods-downloads.conf;
}
