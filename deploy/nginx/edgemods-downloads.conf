# EDGEmods: free downloads at a limited speed (docs/design.md, "Subscriptions and download speed").
#
# Include this inside the edgemods.ai server block, next to the location that passes requests to the EDGEmods
# service (127.0.0.1:8800). The service runs with EDGEMODS_DOWNLOADS=nginx and answers a download with
#
#   X-Accel-Redirect: /_edgemods/github/<GitHub's file host>/<path>?<signed query>
#   X-Accel-Limit-Rate: <bytes a second>              (EDGEMODS_FREE_SPEED, in MB/s)
#
# nginx then fetches the file from GitHub's file host and passes it to the player at that speed. Nothing is kept on
# the server's disk. The service only names GitHub's own file hosts; this location accepts no other, so it cannot be
# used to fetch anything else.
#
# UNTESTED: written 2026-11-21 with R3d, to be tested on the server at R3h (deploy). Check there:
#   - the resolver: AWS's VPC resolver is 169.254.169.253; systemd-resolved is 127.0.0.53;
#   - the CA bundle: /etc/pki/tls/certs/ca-bundle.crt on Amazon Linux, /etc/ssl/certs/ca-certificates.crt on Ubuntu;
#   - that the signed query string reaches GitHub intact ($args after an X-Accel-Redirect with a query);
#   - that X-Accel-Limit-Rate slows the download, and that buffering off keeps nginx's temporary files empty.

location ~ ^/_edgemods/github/(?<edgemods_host>objects\.githubusercontent\.com|release-assets\.githubusercontent\.com)/(?<edgemods_path>.*)$ {
    # Only reachable through X-Accel-Redirect from the service, never from a browser.
    internal;

    # proxy_pass with a variable needs a resolver.
    resolver 169.254.169.253 valid=300s ipv6=off;
    resolver_timeout 5s;

    proxy_pass https://$edgemods_host/$edgemods_path$is_args$args;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $edgemods_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

    # Send GitHub nothing of the player's: no cookies, no sign-in, no address.
    proxy_set_header Host $edgemods_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";

    # Read from GitHub only as fast as the player takes the file; never park it on disk (up to 1 GB a download by
    # default otherwise). The speed itself comes from the service's X-Accel-Limit-Rate.
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # GitHub's cookies and caching headers are not the player's business.
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-GitHub-Request-Id;
    add_header Cache-Control "no-store" always;
}
