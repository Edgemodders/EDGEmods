# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.
# This is EDGEmods' developer docs site, not the EDGEmods mod website itself.

title: EDGEmods
url: https://edgemodders.github.io
baseurl: /EDGEmods
repo: https://github.com/Edgemodders/EDGEmods

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: Format
    url: /manifest.html
  - title: Registry
    url: /registry.html
  - title: Research
    url: /research.html
  - title: Dev setup
    url: /dev-setup.html
  - title: REDdeck
    url: https://edgemodders.github.io/REDdeck/
  - title: REDcode
    url: https://edgemodders.github.io/REDcode/
